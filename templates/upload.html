{% extends "base.html" %}

{% block title %}Upload Dataset{% endblock %}

{% block content %}

<div class="container" style="margin-top:120px; margin-bottom:80px;">

    <div class="glass-box">

        <h1 class="text-center text-warning mb-4">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            Upload Dataset
        </h1>

        <p class="text-center text-light mb-4">
            Upload your dataset for AI-powered analysis.
        </p>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <div class="mb-4">

                <input
                    class="form-control form-control-lg"
                    type="file"
                    name="file"
                    accept=".csv,.txt"
                    required>

            </div>

            <div class="text-center">

                <button class="btn btn-gold">

                    <i class="fa-solid fa-brain"></i>

                    Analyze Dataset

                </button>

            </div>

        </form>

        <hr class="mt-5">

        <h4 class="text-warning">Supported File Types</h4>

        <ul class="text-light">

            <li>✅ CSV (.csv)</li>

            <li>✅ TXT (.txt)</li>

            <li>🟡 PCAP (Coming Soon)</li>

            <li>🟡 PCAPNG (Coming Soon)</li>

        </ul>

    </div>

</div>

{% endblock %}
