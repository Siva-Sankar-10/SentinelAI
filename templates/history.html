{% extends "base.html" %}

{% block content %}

<div class="container mt-5 pt-5">

<h1 class="text-warning mb-4">

Prediction History

</h1>

<table class="table table-dark table-striped">

<tr>

<th>ID</th>

<th>File</th>

<th>Total</th>

<th>Attack</th>

<th>Normal</th>

<th>Date</th>

</tr>

{% for row in history %}

<tr>

<td>{{ row[0] }}</td>

<td>{{ row[1] }}</td>

<td>{{ row[2] }}</td>

<td>{{ row[3] }}</td>

<td>{{ row[4] }}</td>

<td>{{ row[5] }}</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
